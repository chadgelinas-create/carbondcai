[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "carbon-dc-skid2"
version = "1.0.0"
description = "Skid 2 PMS/EMS backend and verification service"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Carbon DC Skid 2 Engineering" }]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "psycopg[binary]>=3.2,<4",
  "pymodbus==3.14.0",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
  "websockets>=15,<17",
]

[dependency-groups]
dev = [
  "detect-secrets>=1.5,<2",
  "httpx>=0.28,<1",
  "mypy>=2,<3",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/skid2"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["A", "ANN", "B", "C4", "DTZ", "E4", "E7", "E9", "F", "I", "N", "PERF", "PIE", "PTH", "RUF", "S", "SIM", "T20", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"migrations/**/*.py" = ["ANN", "N999"]
"src/skid2/cli.py" = ["T201"]
"src/skid2/protocol/cli.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["skid2"]
plugins = ["pydantic.mypy"]
exclude = ["^migrations/"]
warn_unreachable = true
pretty = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=skid2",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--cov-fail-under=85",
]

[tool.coverage.run]
source = ["skid2"]
branch = true
omit = [
  "src/skid2/*/__init__.py",
  "src/skid2/backend/ems_api.py",
  "src/skid2/backend/app.py",
  "src/skid2/ems/config.py",
  "src/skid2/ems/supervisor.py",
  "src/skid2/ems/device_manager.py",
  "src/skid2/ems/auth.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
