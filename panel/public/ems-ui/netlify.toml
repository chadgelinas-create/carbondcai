# Static EMS admin UI (sim by default; live Connect needs a reachable API).
[build]
  publish = "."
  command = "echo 'static ems-ui — no build'"

[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

# Optional: proxy /api to a public FastAPI host (set SKID2_NETLIFY_API_ORIGIN in Netlify UI,
# then replace the to= URL below, or use Connect/?api= in the browser).
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-PUBLIC-API-HOST/api/:splat"
#   status = 200
#   force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
